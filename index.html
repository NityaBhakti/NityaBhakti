<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitya Bhaktii — Conectando con tu ser</title>
<meta name="description" content="Coaching ontológico, meditación, reiki y terapia con sonido. Sesiones online. Pedí tu turno con Nadia Cañete.">
<link rel="shortcut icon" href="favicon.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Marcellus&family=Playfair+Display:wght@500;600;700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ⬇️⬇️ CONFIGURACIÓN DE LA AGENDA ⬇️⬇️
     Pegá entre las comillas la URL de tu Google Apps Script (terminada en /exec).
     Dejala vacía ("") para seguir en MODO DEMO. Ver: CONFIGURAR-GOOGLE-CALENDAR.md -->
<script>
  window.NB_AGENDA = { endpoint: "https://script.google.com/macros/s/AKfycbx-k6ReHvl-GKSAjc5Qpsw0IxXduKx_2WE6OtnpEfoCw3A9r93dOdkAToqJe6Lj71fRcg/exec" };
</script>
<script src="agenda.js"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="booking.jsx"></script>
<script type="text/babel" src="flows.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "flujoTurnos": "Express",
  "acento": "#8f6fc0",
  "fuenteTitulos": "Marcellus",
  "fondoSeccion": "#f7f2ec"
}/*EDITMODE-END*/;

const FLOW_MAP = { "Asistido":"split", "Wizard":"wizard", "Express":"compact" };

function Site(){
  const [t,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [preselect,setPreselect] = useState(null);

  // aplicar tweaks de estilo a las variables CSS
  useEffect(()=>{
    const r=document.documentElement.style;
    r.setProperty("--lavanda", t.acento);
    r.setProperty("--lila-wash", t.fondoSeccion);
    r.setProperty("--serif", `"${t.fuenteTitulos}", Georgia, serif`);
  },[t.acento,t.fondoSeccion,t.fuenteTitulos]);

  const goBook = (key)=>{
    if(typeof key==="string") setPreselect(key); else setPreselect(null);
    const el=document.getElementById("turnos");
    if(el) window.scrollTo({top:el.offsetTop-60,behavior:"smooth"});
  };

  return (
    <>
      <Nav onBook={(e)=>{e&&e.preventDefault&&e.preventDefault();goBook();}}/>
      <Hero onBook={(e)=>{e&&e.preventDefault&&e.preventDefault();goBook();}}/>
      <About/>
      <Therapies onBook={goBook}/>
      {/* key fuerza re-montaje al cambiar de flujo o preselección */}
      <BookingSection key={t.flujoTurnos+"|"+(preselect||"")} flow={FLOW_MAP[t.flujoTurnos]} preselect={preselect}/>
      <Footer/>

      <TweaksPanel>
        <TweakSection label="Flujo de turnos"/>
        <TweakRadio label="Variación" value={t.flujoTurnos}
          options={["Asistido","Wizard","Express"]}
          onChange={v=>setTweak("flujoTurnos",v)}/>
        <TweakSection label="Identidad visual"/>
        <TweakColor label="Acento" value={t.acento}
          options={["#8f6fc0","#7d5bb0","#a07fd0","#9aae8d","#c98aa8"]}
          onChange={v=>setTweak("acento",v)}/>
        <TweakColor label="Fondo de sección" value={t.fondoSeccion}
          options={["#f3ecfa","#f6f0f9","#eef1ec","#f7f2ec"]}
          onChange={v=>setTweak("fondoSeccion",v)}/>
        <TweakSelect label="Fuente de títulos" value={t.fuenteTitulos}
          options={["Cormorant Garamond","Marcellus","Playfair Display","Mulish"]}
          onChange={v=>setTweak("fuenteTitulos",v)}/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Site/>);
</script>
</body>
</html>
